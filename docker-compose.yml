services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Server-side: Next.js rewrite proxy target (Docker service name)
        API_BASE_URL: "http://backend:8000"
        # Client-side: browser fetches directly to localhost (since port 8000 is exposed)
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: cinematic-rail-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cinematic-rail-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
